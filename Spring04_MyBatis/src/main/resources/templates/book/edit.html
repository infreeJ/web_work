<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>/templates/book/edit.html</title>
</head>
<body>
	<div class="container">
		<form th:action="@{/book/update}" method="post">
			<input type="hidden" name="num" th:value="${dto.num}"/>
			<div>
				<label for="title">제목</label>
				<input type="text" name="title" th:value="${dto.title}"/>
			</div>
			<div>
				<label for="author">작가</label>
				<input type="text" name="author" th:value="${dto.author}"/>
			</div>
			<div>
				<label for="publisher">출판사</label>
				<input type="text" name="publisher" th:value="${dto.publisher}"/>
			</div>
			<button type="submit">수정</button>
			<button type="reset">취소</button>
		</form>
	</div>
</body>
</html>
